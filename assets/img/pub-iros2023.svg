<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 224" width="380" height="224" role="img" aria-label="Placeholder figure for the isolation-ward robot service paper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#dbe6f3"/>
    </linearGradient>
  </defs>
  <rect width="380" height="224" fill="url(#bg)"/>
  <rect x="14" y="14" width="352" height="196" rx="10" fill="none" stroke="#9fb6d1" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- care robot + medical cross motif -->
  <g transform="translate(190 92)" fill="none" stroke="#043361" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="-40" x2="0" y2="-30"/>
    <circle cx="0" cy="-42" r="3.5" fill="#043361" stroke="none"/>
    <rect x="-30" y="-30" width="60" height="46" rx="12"/>
    <circle cx="-12" cy="-8" r="5.5" fill="#043361" stroke="none"/>
    <circle cx="12" cy="-8" r="5.5" fill="#043361" stroke="none"/>
    <line x1="-8" y1="6" x2="8" y2="6"/>
  </g>
  <!-- medical cross badge -->
  <g transform="translate(223 66)">
    <circle cx="0" cy="0" r="15" fill="#fba524"/>
    <path d="M-2.6 -8 h5.2 v5.4 h5.4 v5.2 h-5.4 v5.4 h-5.2 v-5.4 h-5.4 v-5.2 h5.4 z" fill="#ffffff"/>
  </g>

  <text x="190" y="168" text-anchor="middle" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#043361">Figure coming soon</text>
  <text x="190" y="190" text-anchor="middle" font-family="Lato, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#5a7595">Robot-assisted isolation-ward services</text>
